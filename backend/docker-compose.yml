name: youngstorage

services:
  api:
    build: .
    env_file: .env
    environment:
      ENVIRONMENT: development
    # root + docker socket so the API can stop/start/inspect lab containers.
    # Dev convenience; production should use a socket proxy or rootless Docker.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik_dynamic:/dynamic
    ports:
      - "8000:8000"
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      wg-gateway: { condition: service_healthy }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    # root + docker socket so the worker can build/run lab containers.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik_dynamic:/dynamic
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "1883:1883"     # MQTT
      - "15675:15675"   # Web-MQTT (browser)
      - "15672:15672"   # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  traefik:
    image: traefik:v3.1
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # File provider for dynamic per-lab routes written by the backend.
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"     # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_dynamic:/dynamic
    networks:
      default:
      labs:
        ipv4_address: 172.30.0.254   # fixed, outside the lab allocator range

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"     # SMTP
      - "8025:8025"     # Web UI

  flower:
    image: mher/flower:2.0
    command: celery --broker=${CELERY_BROKER_URL:-redis://redis:6379/1} flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis: { condition: service_healthy }

  # ---- DBaaS engines (Phase 5) ----
  mysql:
    image: mysql:8.0
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ys_mysql_root}
      DBAAS_SQL_ADMIN_USER: ${DBAAS_SQL_ADMIN_USER:-ysadmin}
      DBAAS_SQL_ADMIN_PASSWORD: ${DBAAS_SQL_ADMIN_PASSWORD:-ys_admin_pw}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/db/admin-init.sql:/docker-entrypoint-initdb.d/admin-init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-ys_mysql_root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-ys_mariadb_root}
      DBAAS_SQL_ADMIN_USER: ${DBAAS_SQL_ADMIN_USER:-ysadmin}
      DBAAS_SQL_ADMIN_PASSWORD: ${DBAAS_SQL_ADMIN_PASSWORD:-ys_admin_pw}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/db/admin-init.sql:/docker-entrypoint-initdb.d/admin-init.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb-dbaas:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DBAAS_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DBAAS_ROOT_PASSWORD:-ys_mongo_root}
    volumes:
      - mongodb_dbaas_data:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_DBAAS_ROOT_USER:-root}", "-p", "${MONGO_DBAAS_ROOT_PASSWORD:-ys_mongo_root}", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  wg-gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    env_file: .env
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - wg_config:/etc/wireguard
    ports:
      - "51820:51820/udp"   # WireGuard endpoint clients dial
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
  wg_config:
  traefik_dynamic:
  mysql_data:
  mariadb_data:
  mongodb_dbaas_data:

networks:
  default:
  # Declared so Traefik can attach and reach lab containers by their static IP.
  # docker_service.ensure_network() finds this existing network at provision time.
  labs:
    name: youngstorage_labs
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
