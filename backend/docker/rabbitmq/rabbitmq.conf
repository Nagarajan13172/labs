# Allow the default guest user to connect over the network (dev only).
loopback_users = none

# MQTT listener (plain) on 1883
mqtt.listeners.tcp.default = 1883
mqtt.allow_anonymous = false
mqtt.vhost = /
mqtt.exchange = amq.topic

# Web-MQTT (websocket) listener on 15675 for browser clients (frontend).
web_mqtt.tcp.port = 15675
